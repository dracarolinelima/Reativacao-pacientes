var MES_ORDER=['2026-03','2026-02','2026-01','2025-12','2025-11','2025-10','2025-09','2025-08','2025-07','2025-06','2025-05','2025-04'];
var STATUS_OPTS=[['pendente','Pendente'],['contactada','Contactada'],['agendou','Agendou'],['nao_respondeu','Não respondeu'],['sem_interesse','Sem interesse']];
var WA_SVG='<svg width="13" height="13" viewBox="0 0 24 24" fill="white" style="vertical-align:middle"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';

var data,filtro='todos';
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){data=JSON.parse(s);}
    else{data=BASE.map(function(p){return Object.assign({},p,{status:'pendente',obs:'',dataContato:''});});}
  }catch(e){data=BASE.map(function(p){return Object.assign({},p,{status:'pendente',obs:'',dataContato:''});});}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function upd(id,f,v){
  data=data.map(function(p){if(p.id===id){var n=Object.assign({},p);n[f]=v;return n;}return p;});
  save();updateStats();render();
}
function getMsg(){return document.getElementById('msg').value;}
function waLink(p){
  var m=getMsg().replace('[NOME]',p.nome.split(' ')[0]);
  return 'https://wa.me/'+p.wa+'?text='+encodeURIComponent(m);
}
function setF(f,btn){
  filtro=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');render();
}
function updateStats(){
  var tot=data.length;
  var alta=data.filter(function(p){return p.pri==='ALTA';}).length;
  var cont=data.filter(function(p){return p.status==='contactada';}).length;
  var agen=data.filter(function(p){return p.status==='agendou';}).length;
  document.getElementById('s-total').textContent=tot;
  document.getElementById('s-alta').textContent=alta;
  document.getElementById('s-cont').textContent=cont;
  document.getElementById('s-agen').textContent=agen;
  document.getElementById('prog').style.width=Math.round(agen/tot*100)+'%';
}
function render(){
  var busca=document.getElementById('busca').value.toLowerCase();
  var filtered=data.filter(function(p){
    if(filtro!=='todos'&&p.status!==filtro)return false;
    if(busca&&p.nome.toLowerCase().indexOf(busca)<0)return false;
    return true;
  });
  var html='';
  MES_ORDER.forEach(function(mo){
    var grupo=filtered.filter(function(p){return p.mo===mo;});
    if(!grupo.length)return;
    var tot_mes=data.filter(function(p){return p.mo===mo;}).length;
    html+='<div class="section-head">'+grupo[0].mes+'<span class="section-count">'+grupo.length+' / '+tot_mes+'</span></div><div class="cards">';
    grupo.forEach(function(p){
      var sc=p.status;
      var bl=sc==='agendou'?'#1D9E75':sc==='contactada'?'#378ADD':sc==='nao_respondeu'?'#E24B4A':'#ddd';
      var uc='b-'+p.unidade.toLowerCase();
      var opts=STATUS_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(p.status===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('');
      html+='<div class="card'+(p.pri==='ALTA'?' alta':'')+'" style="border-left-color:'+bl+'">'+
        '<div class="card-top">'+
          '<div class="card-left">'+
            '<div class="card-name">'+p.nome+'</div>'+
            '<div class="badges">'+(p.pri==='ALTA'?'<span class="badge b-alta">alta prioridade</span>':'')+
            '<span class="badge '+uc+'">'+p.unidade+'</span></div>'+
            '<div class="meta">Última visita: '+p.ult+' · '+p.tipo+'</div>'+
          '</div>'+
          '<div class="card-right">'+
            '<select class="status-sel" onchange="upd('+p.id+',\'status\',this.value)">'+opts+'</select>'+
            '<a class="wa-btn" href="'+waLink(p)+'" target="_blank">'+WA_SVG+' WhatsApp</a>'+
          '</div>'+
        '</div>'+
        '<div class="obs-row"><input class="obs-inp" type="text" value="'+p.obs.replace(/"/g,'&quot;')+'" placeholder="Observação..." oninput="upd('+p.id+',\'obs\',this.value)"></div>'+
      '</div>';
    });
    html+='</div>';
  });
  if(!html)html='<p style="color:#999;font-size:14px;padding:1rem 0">Nenhuma paciente encontrada.</p>';
  document.getElementById('lista').innerHTML=html;
}
function copiar(){
  var m=document.getElementById('msg').value;
  navigator.clipboard.writeText(m).then(function(){
    var b=document.getElementById('copybtn');b.textContent='Copiado!';b.classList.add('ok');
    setTimeout(function(){b.textContent='Copiar mensagem';b.classList.remove('ok');},2000);
  });
}
document.getElementById('msg').addEventListener('input',function(){render();});
load();updateStats();render();
</script>
